# SkillHub LAN - DSH plugin repository location
#
# 由 web 镜像自带的 server 级钩子加载：
#   include /etc/nginx/skillhub-base-path*.conf;
# 因此本文件必须命名匹配该通配符，且只包含 server 上下文允许的指令。
#
# 插件资产放在 /srv/dsh-plugins（nginx root 之外），原因：
# 镜像的 /docker-entrypoint.d/20-base-path.sh 会
#   find $root -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -exec sed -i ...
# 若把含 index.html 的插件门户页挂进 /usr/share/nginx/html/，只读挂载会让
# sed 无法创建临时文件，entrypoint 失败并导致 web 容器无限重启。
#
# 鉴权：GET 完全公开；PUT / DELETE 由 auth_request /site/.auth-check 校验
# SkillHub 网站登录态（详见 site.conf）。不再使用 auth_basic / htpasswd。

location ^~ /dsh-plugins/ {
    alias /srv/dsh-plugins/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# ---------------------------------------------------------------------------
# 写权限探测端点：前端 / 部署脚本可用它判断「当前网站会话能否写插件仓库」。
#   未登录网站 -> 401（含干净 JSON）；已登录 -> 200 返回插件清单内容。
# 只读、无副作用、不新增文件；前端仅用状态码判断，不解析内容。
# 不能用 `return 204`：return 属于 rewrite 阶段，会早于 auth_request 的
# access 阶段执行，导致任何人都拿到 204，登录校验形同虚设。
# ---------------------------------------------------------------------------
location = /dsh-plugins/.auth {
    auth_request /site/.auth-check;
    error_page 401 = @site-login-required;
    alias /srv/dsh-plugins/index.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# ---------------------------------------------------------------------------
# Web 端插件发布通道（由首页「DSH 插件市场」面板的发布表单调用）
#
# GET 公开；PUT / DELETE 需网站登录。auth_request 不允许写在 limit_except
# 内，因此用 418 + error_page 把写方法转到命名 location 统一处理。
# 用 root 而非 alias，DAV 模块才能正确计算 $request_filename；
# client_body_temp_path 必须落在同一个 bind mount 内，否则上传时 rename 会
# 因跨文件系统（EXDEV）失败。目录由 run.sh 提前创建并放宽权限。
# ---------------------------------------------------------------------------

# 版本清单：整体替换，前端保存前会重新 GET 最新版本做冲突校验
location = /dsh-plugins/index.json {
    root /srv;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    error_page 418 = @dsh-index-write;
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 418; }
}

location @dsh-index-write {
    auth_request /site/.auth-check;

    root /srv;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    dav_methods PUT DELETE;
    dav_access user:rw group:rw all:r;
    create_full_put_path on;
    client_max_body_size 4m;
    client_body_temp_path /srv/dsh-plugins/versions/.tmp;
}

# 插件 tarball：允许上传与删除单个版本文件
location ^~ /dsh-plugins/versions/ {
    root /srv;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    error_page 418 = @dsh-versions-write;
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 418; }
}

location @dsh-versions-write {
    auth_request /site/.auth-check;

    root /srv;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    dav_methods PUT DELETE;
    dav_access user:rw group:rw all:r;
    create_full_put_path on;
    client_max_body_size 50m;
    client_body_temp_path /srv/dsh-plugins/versions/.tmp;
}

# 上传临时目录与隐藏文件不允许公开读取
location ^~ /dsh-plugins/versions/. {
    deny all;
}

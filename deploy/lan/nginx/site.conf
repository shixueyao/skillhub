# ============================================================================
# 站点定制层 —— 由官方镜像模板的
#   include /etc/nginx/skillhub-base-path*.conf;
# 在 server 上下文中加载。全部逻辑通过 bind mount 注入，不重建任何镜像。
#
#   1. sub_filter 注入 /site/site-auth.js + /site/inject.js 到所有 text/html
#   2. /site/          静态托管注入脚本与管理界面
#   3. /site/content/  首页内容 JSON，写操作用「网站登录态」保护
#
# 鉴权模型（v2，取代早期的 auth_basic 独立口令）：
#   SkillHub 前台登录是服务端 Spring Session（HttpOnly 的 SESSION cookie，
#   数据存 Redis），前端没有 token。nginx 用 auth_request 发一个内部子请求到
#   Java 后端 GET /api/cli/v1/auth/whoami：
#     匿名 -> 401（写操作被拒绝）  网站已登录 -> 200（放行）
#   子请求继承原请求的 Cookie，因此校验的就是真实的网站登录态。
#   不再有 siteadmin / htpasswd / 第二套口令。
# ============================================================================

# 官方模板开启了 gzip，但 index.html 是 nginx 本地静态文件：sub_filter 在
# gzip filter 之前处理原文，因此可以共存，无需（也不能）在这里重复定义 gzip。
# sub_filter_types 默认即 text/html，无需重复声明（会触发 duplicate MIME 警告）
# site-auth.js 必须先于 inject.js 执行（均为 defer，按文档顺序）。
sub_filter '</head>' '<script src="/site/site-auth.js" defer></script><script src="/site/inject.js" defer></script></head>';
sub_filter_once on;

# ---------------------------------------------------------------------------
# 网站登录校验子请求（供所有写操作 location 的 auth_request 使用）
#
# 选 whoami 而不是 /api/v1/auth/me：前者在 RouteSecurityPolicyRegistry 中
# 显式声明 authenticated，无副作用、无限流、无审核逻辑；后端未登录返回
# 401 JSON 且不带 WWW-Authenticate，不会触发浏览器 Basic 弹窗。
#
# auth_request 的子请求默认继承原请求的 Cookie（SESSION / XSRF-TOKEN），
# 这里显式关闭 body 转发，避免 PUT 的大包被复制一份到后端。
# ---------------------------------------------------------------------------
location = /site/.auth-check {
    internal;
    proxy_pass $skillhub_api_upstream/api/cli/v1/auth/whoami;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $skillhub_forwarded_host;
    proxy_set_header X-Forwarded-Host $skillhub_forwarded_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_set_header X-Forwarded-Prefix $skillhub_forwarded_prefix;
    proxy_set_header Accept "application/json";
}

# auth_request 返回 401 时统一回一个干净的 JSON（不带 WWW-Authenticate）
location @site-login-required {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 401 '{"code":401,"msg":"请先登录 SkillHub 网站后再发布或修改内容"}';
}

# 站点定制静态资源。^~ 保证优先于模板里的正则 location。
location ^~ /site/ {
    root /srv;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# ---------------------------------------------------------------------------
# 首页内容：GET 公开；PUT / DELETE 需要「网站已登录」。
#
# nginx 的 auth_request 指令不允许写在 limit_except 里（会报
# "auth_request directive is not allowed here"），因此用 418 + error_page
# 把非 GET 请求内部重定向到命名 location，在那里统一做会话校验和 DAV 写入。
# 用 root（而非 alias）以便 DAV 模块正确计算 $request_filename；
# client_body_temp_path 指向同一目录，避免写入时跨挂载 rename 失败。
# ---------------------------------------------------------------------------
location ^~ /site/content/ {
    root /srv;
    add_header Cache-Control "no-store" always;
    error_page 418 = @site-content-write;
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 418; }
}

location @site-content-write {
    auth_request /site/.auth-check;

    root /srv;
    add_header Cache-Control "no-store" always;
    dav_methods PUT DELETE;
    dav_access user:rw group:rw all:r;
    create_full_put_path on;
    client_max_body_size 1m;
    client_body_temp_path /srv/site/content;
}
